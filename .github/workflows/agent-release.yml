# Builds the agent for Linux (amd64 + arm64) and runs its tests on PRs that touch agent/.
# On a tag like agent-v1.0.0 it also attaches the binaries to a GitHub release.
# Supply chain: read-only token by default; only the tag-only release job can write; actions are pinned
# to full commit SHAs; the upload uses the runner's preinstalled gh CLI (no third-party action).
name: agent release

on:
  push:
    tags: ["agent-v*"]
  pull_request:
    paths: ["agent/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        env:
          REF: ${{ github.ref_name }}
        run: |
          VERSION="${REF#agent-v}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/server-pulse-agent-linux-$arch" .
          done
          (cd dist && sha256sum server-pulse-agent-linux-* > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-binaries
          path: agent/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-binaries
          path: dist
      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "server-pulse-agent ${TAG#agent-v}"
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
